---
- name: Check Homebrew is installed
  ansible.builtin.command: brew --version
  register: base_brew
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require Homebrew
  ansible.builtin.assert:
    that: base_brew.rc == 0
    fail_msg: "Homebrew is missing. Run install.sh (it installs Homebrew) or see https://brew.sh."
    quiet: true

# Like apt's cache update: it refreshes Homebrew and its formula metadata, not installed software,
# so it does not count as a change (keeps the second run at changed=0).
- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true
  changed_when: false
