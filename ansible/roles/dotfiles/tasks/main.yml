---
- name: Create installer cache directory
  ansible.builtin.file:
    path: "{{ installer_cache }}"
    state: directory
    mode: "0755"

- name: Download chezmoi installer
  ansible.builtin.get_url:
    url: https://get.chezmoi.io
    dest: "{{ installer_cache }}/chezmoi-install.sh"
    mode: "0755"

- name: Install chezmoi
  ansible.builtin.command: sh {{ installer_cache }}/chezmoi-install.sh -b {{ local_bin }}
  args:
    creates: "{{ local_bin }}/chezmoi"

- name: Check for an existing chezmoi source
  ansible.builtin.stat:
    path: "{{ dotfiles_source_dir }}/.git"
  register: dotfiles_source

# First run on a machine: take over without losing its git identity or settings.
- name: Read the existing git user name
  community.general.git_config_info:
    name: user.name
    scope: global
  register: dotfiles_git_name_current
  when: not dotfiles_source.stat.exists

- name: Read the existing git user email
  community.general.git_config_info:
    name: user.email
    scope: global
  register: dotfiles_git_email_current
  when: not dotfiles_source.stat.exists

# The dotfiles' ~/.gitconfig ends with `[include] path = ~/.gitconfig.local`, so the machine's own
# settings (signingkey, gpgsign, credential helpers, ...) keep applying on top of the template.
- name: Keep machine-specific git settings in ~/.gitconfig.local
  ansible.builtin.command: mv {{ workstation_home }}/.gitconfig {{ workstation_home }}/.gitconfig.local
  args:
    creates: "{{ workstation_home }}/.gitconfig.local"
    removes: "{{ workstation_home }}/.gitconfig"
  when: not dotfiles_source.stat.exists

- name: Initialize dotfiles with chezmoi
  ansible.builtin.command:
    argv:
      - chezmoi
      - init
      - --branch
      - "{{ dotfiles_branch }}"
      - --promptString
      - "Git name={{ dotfiles_git_name }}"
      - --promptString
      - "Git email={{ dotfiles_git_email }}"
      - "{{ dotfiles_repo }}"
  register: dotfiles_init
  when: not dotfiles_source.stat.exists
  changed_when: true

- name: Pull dotfiles updates
  ansible.builtin.command: chezmoi git -- pull --ff-only
  register: dotfiles_pull
  when: dotfiles_source.stat.exists
  changed_when: "'Already up to date' not in dotfiles_pull.stdout"

- name: Apply dotfiles safely
  when: dotfiles_source.stat.exists or dotfiles_init is changed
  block:
    - name: Read chezmoi status
      ansible.builtin.command: chezmoi status
      register: dotfiles_status
      changed_when: false
      check_mode: false

    - name: Read chezmoi state
      ansible.builtin.command: chezmoi state dump --format json
      register: dotfiles_state
      changed_when: false
      check_mode: false

    # Includes the first run: every existing ~/.bashrc, ~/.vimrc, ~/.claude/settings.json, ...
    - name: Back up existing files before chezmoi takes them over
      ansible.builtin.copy:
        src: "{{ workstation_home }}/{{ item }}"
        dest: "{{ workstation_home }}/{{ item }}.pre-chezmoi"
        remote_src: true
        force: false
        mode: preserve
      loop: "{{ dotfiles_backup_files }}"

    - name: Warn about local dotfile edits
      ansible.builtin.debug:
        msg: >-
          Not applying dotfiles: edited locally since the last apply: {{ dotfiles_local_edits | join(', ') }}.
          Run `dotfiles-backup` to keep them (or `chezmoi apply --force` to discard), then re-run.
      when: dotfiles_local_edits | length > 0

    - name: Apply dotfiles
      ansible.builtin.command: chezmoi apply --no-tty
      when: dotfiles_pending and dotfiles_local_edits | length == 0
      changed_when: true
