---
name: Set up toolchain
description: Install uv, sync the pinned toolchain from uv.lock and install the Ansible collections.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        enable-cache: true
    - name: Sync pinned toolchain
      shell: bash
      run: uv sync --locked --group dev
    - name: Install Ansible collections (from GitHub, no Galaxy)
      shell: bash
      run: uv run --locked ansible-galaxy collection install --no-deps -r requirements.yml
