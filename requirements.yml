---
# Installed from GitHub, not Galaxy: macOS XProtect blocks downloads from Galaxy's S3 artifact
# storage. Install with `--no-deps` so nothing is resolved from Galaxy; list dependencies here.
collections:
  - name: https://github.com/ansible-collections/community.general.git
    type: git
    version: "13.4.0"
  - name: https://github.com/ansible-collections/community.library_inventory_filtering.git
    type: git
    version: "1.1.5"  # dependency of community.general
